[tool.poetry]
name = "memo-claw"
description = "AI-powered content pipeline for animated character episodes"
version = "0.1.0"
authors = []
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
pgvector = "^0.3.0"
alembic = "^1.14.0"
pydantic-settings = "^2.7.0"
httpx = "^0.28.0"
anthropic = "^0.42.0"
python-dotenv = "^1.0.0"
structlog = "^24.4.0"
click = "^8.1.0"
aioboto3 = "^13.0.0"

[tool.poetry.dependencies.optional]
aioboto3 = {version = "^13.0.0", optional = true}

[tool.poetry.scripts]
memo-claw = "src.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
